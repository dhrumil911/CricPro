<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1b49b6" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#facc15" />
    </linearGradient>
  </defs>

  {/* Circular blue swoosh (Primary Swoosh, Thicker & 15% Larger) */}
  <path 
    d="M 28,87 A 41,41 0 1,1 87,43" 
    stroke="url(#blueGradFav)" 
    strokeWidth="9" 
    strokeLinecap="round" 
    fill="none" 
  />
  
  {/* Minimal motion effect (Secondary Swoosh, Thicker & 15% Larger) */}
  <path 
    d="M 39,78 A 31,31 0 1,1 79,48" 
    stroke="url(#blueGradFav)" 
    strokeWidth="4" 
    strokeLinecap="round" 
    fill="none" 
    opacity="0.4" 
  />
  
  {/* Rotated Gold Cricket Bat + Ball Group */}
  <g transform="rotate(45 50 50)">
    {/* Bat blade (Scales Up) */}
    <rect 
      x="43.5" 
      y="36" 
      width="13" 
      height="38" 
      rx="3.5" 
      fill="url(#goldGradFav)" 
      stroke="#ffffff" 
      strokeWidth="3" 
    />
    {/* Bat handle (Scales Up) */}
    <rect 
      x="48" 
      y="10" 
      width="4" 
      height="27" 
      rx="2" 
      fill="url(#goldGradFav)" 
      stroke="#ffffff" 
      strokeWidth="2" 
    />
    
    {/* Handle details */}
    <line x1="48.5" y1="16" x2="51.5" y2="16" stroke="#ffffff" strokeWidth="1.2" />
    <line x1="48.5" y1="21" x2="51.5" y2="21" stroke="#ffffff" strokeWidth="1.2" />

    {/* Cricket Ball with Seam (Larger for visibility) */}
    <circle 
      cx="65.5" 
      cy="54" 
      r="8" 
      fill="#e2e8f0" 
      stroke="#ffffff" 
      strokeWidth="2.5" 
    />
    <path 
      d="M 60,58 A 8,8 0 0,1 71,47" 
      stroke="url(#goldGradFav)" 
      strokeWidth="1.5" 
      strokeLinecap="round" 
      fill="none" 
    />
  </g>
</svg>